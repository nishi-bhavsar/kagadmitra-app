<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900"><rect width="800" height="900" fill="#fffef9"/><rect width="800" height="14" fill="#F4A300"/><rect x="20" y="30" width="760" height="850" fill="none" stroke="#F4A300" stroke-width="3"/><g font-family="Arial, Helvetica, sans-serif"><text x="50" y="110" font-size="22" fill="#222">GOVERNMENT OF MAHARASHTRA (SAMPLE - FICTIONAL)</text><text x="50" y="150" font-size="22" fill="#222">Department of Agriculture - Taluka Agriculture Office, Shirur</text><text x="50" y="190" font-size="22" fill="#222"></text><text x="50" y="230" font-size="22" fill="#222">NOTICE: Micro Irrigation (Drip) Subsidy Scheme</text><text x="50" y="270" font-size="22" fill="#222">Ref No: AGR/MI/2026/0457     Date: 20 October 2026</text><text x="50" y="310" font-size="22" fill="#222"></text><text x="50" y="350" font-size="22" fill="#222">To: Shri Ramesh Patil, Village Shirur</text><text x="50" y="390" font-size="22" fill="#222"></text><text x="50" y="430" font-size="22" fill="#222">You are eligible to apply for subsidy on drip irrigation.</text><text x="50" y="470" font-size="22" fill="#222">Submit the application form at the Taluka Agriculture</text><text x="50" y="510" font-size="22" fill="#222">Office on or before 30 November 2026.</text><text x="50" y="550" font-size="22" fill="#222"></text><text x="50" y="590" font-size="22" fill="#222">Documents required: 7/12 extract, 8A extract,</text><text x="50" y="630" font-size="22" fill="#222">Aadhaar copy, bank passbook copy, 2 photographs.</text><text x="50" y="670" font-size="22" fill="#222"></text><text x="50" y="710" font-size="22" fill="#222">Applications received after the last date will not be</text><text x="50" y="750" font-size="22" fill="#222">considered. Subsidy is paid only after field inspection.</text><text x="50" y="790" font-size="22" fill="#222"></text><text x="50" y="830" font-size="22" fill="#222">Agriculture Officer (Signature)</text></g></svg>